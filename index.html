
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaStore Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b0d12;
  color:white;
  font-family:Arial,sans-serif;
  padding:22px;
}

.container{max-width:850px;margin:auto}

h1{color:#8b9cff}

.card{
  background:#171b25;
  padding:20px;
  border-radius:14px;
  margin:18px 0;
}

input,textarea{
  width:100%;
  padding:13px;
  margin:8px 0;
  background:#252b38;
  color:white;
  border:1px solid #41495c;
  border-radius:8px;
}

button{
  padding:12px 18px;
  background:#7185ff;
  color:white;
  border:0;
  border-radius:8px;
  margin:5px;
  cursor:pointer;
}

button:disabled{opacity:.5;cursor:not-allowed}

.secondary{background:#343b4b}

.product{
  padding:14px;
  border-bottom:1px solid #343b4b;
}

.hidden{display:none!important}

#status{color:#aab7ff}
#loginStatus,#formStatus,#resetStatus{color:#aab7ff;overflow-wrap:anywhere}

</style>
</head>

<body>
<div class="container">

<h1>NovaStore Admin</h1>
<p>Product management dashboard</p>

<!-- ADMIN LOGIN -->

<div class="card" id="login">

<h2>Admin Login</h2>

<input id="email" type="email" placeholder="Admin email" autocomplete="username">

<input id="password" type="password" placeholder="Password" autocomplete="current-password">

<button id="loginBtn">Login</button>

<button id="forgotBtn" class="secondary" type="button">
Forgot password?
</button>

<p id="loginStatus"></p>

</div>

<!-- PASSWORD RESET REQUEST -->

<div class="card hidden" id="forgotBox">

<h2>Reset Password</h2>

<p>Enter your admin email to receive a password reset link.</p>

<input id="resetEmail" type="email" placeholder="Your admin email">

<button id="sendResetBtn">Send Reset Link</button>

<button id="backLoginBtn" class="secondary">Back to Login</button>

<p id="resetStatus"></p>

</div>

<!-- CHOOSE NEW PASSWORD -->

<div class="card hidden" id="newPasswordBox">

<h2>Choose a New Password</h2>

<input id="newPassword" type="password" placeholder="New password" autocomplete="new-password">

<input id="confirmPassword" type="password" placeholder="Confirm new password" autocomplete="new-password">

<button id="savePasswordBtn">Save New Password</button>

<p id="newPasswordStatus"></p>

</div>

<!-- DASHBOARD -->

<div id="dashboard" class="hidden">

<div class="card">

<h2>Welcome, Admin</h2>

<button id="logoutBtn" class="secondary">Logout</button>

</div>

<!-- ADD PRODUCT -->

<div class="card">

<h2>Add Product</h2>

<form id="productForm">

<input id="name" placeholder="Product name" required>

<textarea id="description" placeholder="Description"></textarea>

<input id="price" type="number" step="0.01" placeholder="Price (KSh)" required>

<input id="image" type="url" placeholder="Product image URL">

<input id="category" placeholder="Category">

<button type="submit">Add Product</button>

</form>

<p id="formStatus"></p>

</div>

<!-- PRODUCTS -->

<div class="card">

<h2>Products</h2>

<div id="products">Loading products...</div>

</div>

</div>

<p id="status"></p>

</div>

<script>

// SUPABASE CONNECTION

const SUPABASE_URL =
"https://twocjhhwvpcclipinajd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MTOuE34uvfSjNX1-S03yJQ_I7A3pmcx";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// ELEMENTS

const loginBox = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const forgotBox = document.getElementById("forgotBox");
const newPasswordBox = document.getElementById("newPasswordBox");


// SHOW LOGIN

function showLogin(){

  loginBox.classList.remove("hidden");
  dashboard.classList.add("hidden");
  forgotBox.classList.add("hidden");
  newPasswordBox.classList.add("hidden");

}


// CHECK ADMIN ACCESS

async function checkAdmin(){

  const {data,error} = await db.auth.getSession();

  if(error){
    document.getElementById("loginStatus").textContent =
      error.message;
    showLogin();
    return;
  }

  const session = data.session;

  if(!session){
    showLogin();
    return;
  }

  // VERIFY ADMIN THROUGH SUPABASE

  const result = await db.rpc("is_novatore_admin");

  if(result.error || result.data !== true){

    await db.auth.signOut();

    showLogin();

    document.getElementById("loginStatus").textContent =
      result.error
        ? result.error.message
        : "This account is not authorised as an admin.";

    return;
  }

  loginBox.classList.add("hidden");
  forgotBox.classList.add("hidden");
  newPasswordBox.classList.add("hidden");

  dashboard.classList.remove("hidden");

  loadProducts();

}


// LOGIN

document.getElementById("loginBtn").onclick = async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const button = document.getElementById("loginBtn");
  const message = document.getElementById("loginStatus");

  if(!email || !password){
    message.textContent = "Enter your email and password.";
    return;
  }

  button.disabled = true;
  message.textContent = "Logging in...";

  const {error} = await db.auth.signInWithPassword({
    email,
    password
  });

  button.disabled = false;

  if(error){
    message.textContent = error.message;
    return;
  }

  await checkAdmin();

};


// FORGOT PASSWORD SCREEN

document.getElementById("forgotBtn").onclick = () => {

  const email = document.getElementById("email").value.trim();

  document.getElementById("resetEmail").value = email;

  loginBox.classList.add("hidden");
  forgotBox.classList.remove("hidden");

};


// BACK TO LOGIN

document.getElementById("backLoginBtn").onclick = () => {

  forgotBox.classList.add("hidden");
  loginBox.classList.remove("hidden");

};


// SEND PASSWORD RESET EMAIL

document.getElementById("sendResetBtn").onclick = async () => {

  const email = document.getElementById("resetEmail").value.trim();

  const button = document.getElementById("sendResetBtn");
  const message = document.getElementById("resetStatus");

  if(!email){
    message.textContent = "Enter your email first.";
    return;
  }

  button.disabled = true;
  message.textContent = "Sending reset link...";

  const redirectURL =
    window.location.origin + window.location.pathname;

  const {error} = await db.auth.resetPasswordForEmail(email,{
    redirectTo: redirectURL
  });

  button.disabled = false;

  message.textContent = error
    ? error.message
    : "If this email belongs to an account, a password reset link has been sent. Check your inbox.";

};


// HANDLE PASSWORD RECOVERY

db.auth.onAuthStateChange((event,session) => {

  if(event === "PASSWORD_RECOVERY"){

    loginBox.classList.add("hidden");
    dashboard.classList.add("hidden");
    forgotBox.classList.add("hidden");

    newPasswordBox.classList.remove("hidden");

    document.getElementById("newPasswordStatus").textContent =
      "Enter your new password.";

  }

  if(event === "SIGNED_OUT"){
    showLogin();
  }

});


// SAVE NEW PASSWORD

document.getElementById("savePasswordBtn").onclick = async () => {

  const password =
    document.getElementById("newPassword").value;

  const confirm =
    document.getElementById("confirmPassword").value;

  const button = document.getElementById("savePasswordBtn");
  const message = document.getElementById("newPasswordStatus");

  if(password.length < 8){
    message.textContent = "Password must contain at least 8 characters.";
    return;
  }

  if(password !== confirm){
    message.textContent = "Passwords do not match.";
    return;
  }

  button.disabled = true;
  message.textContent = "Updating password...";

  const {error} = await db.auth.updateUser({
    password: password
  });

  button.disabled = false;

  if(error){
    message.textContent = error.message;
    return;
  }

  message.textContent = "Password updated successfully!";

  document.getElementById("newPassword").value = "";
  document.getElementById("confirmPassword").value = "";

  await checkAdmin();

};


// LOGOUT

document.getElementById("logoutBtn").onclick = async () => {

  const {error} = await db.auth.signOut();

  if(error){
    document.getElementById("status").textContent = error.message;
  }

  showLogin();

};


// LOAD PRODUCTS

async function loadProducts(){

  const box = document.getElementById("products");

  box.textContent = "Loading products...";

  const {data,error} = await db
    .from("products")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    box.textContent = error.message;
    return;
  }

  box.innerHTML = "";

  data.forEach(product => {

    const item = document.createElement("div");
    item.className = "product";

    const title = document.createElement("strong");
    title.textContent = product.name;

    const price = document.createElement("p");
    price.textContent = "KSh " + product.price;

    const edit = document.createElement("button");
    edit.textContent = "Edit";

    edit.onclick = () => editProduct(product);

    const remove = document.createElement("button");
    remove.textContent = "Delete";
    remove.className = "secondary";

    remove.onclick = () => deleteProduct(product.id);

    item.append(title,price,edit,remove);

    box.appendChild(item);

  });

  if(!data.length){
    box.textContent = "No products yet.";
  }

}


// ADD PRODUCT

document.getElementById("productForm").onsubmit = async (e) => {

  e.preventDefault();

  const product = {

    name: document.getElementById("name").value.trim(),

    description:
      document.getElementById("description").value,

    price:
      Number(document.getElementById("price").value),

    image_url:
      document.getElementById("image").value,

    category:
      document.getElementById("category").value

  };

  const button = e.target.querySelector("button[type=submit]");

  button.disabled = true;

  const {error} = await db
    .from("products")
    .insert(product);

  button.disabled = false;

  document.getElementById("formStatus").textContent =
    error
      ? error.message
      : "Product added successfully!";

  if(!error){

    e.target.reset();

    loadProducts();

  }

};


// EDIT PRODUCT

async function editProduct(product){

  const name = prompt("Product name:",product.name);

  if(name === null || !name.trim()) return;

  const price = prompt("Product price:",product.price);

  if(
    price === null ||
    price.trim() === "" ||
    !Number.isFinite(Number(price)) ||
    Number(price) <= 0
  ) return;

  const {error} = await db
    .from("products")
    .update({
      name:name.trim(),
      price:Number(price)
    })
    .eq("id",product.id);

  alert(error ? error.message : "Product updated!");

  loadProducts();

}


// DELETE PRODUCT

async function deleteProduct(id){

  if(!confirm("Are you sure you want to delete this product?")){
    return;
  }

  const {error} = await db
    .from("products")
    .delete()
    .eq("id",id);

  alert(error ? error.message : "Product deleted!");

  loadProducts();

}


// INITIAL CHECK

checkAdmin();

</script>

</body>
</html>
